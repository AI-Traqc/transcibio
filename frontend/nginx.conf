# Map the Upgrade header so WebSocket connections (voice-turn streaming) survive
# the reverse proxy. `''` -> close keeps normal HTTP keep-alive working.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Reverse-proxy the API (and the /api/v1/voice-turn WebSocket) to the backend
    # container. Single origin => no CORS, and the frontend's relative /api/v1
    # URLs + window.location.host WebSocket just work.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket upgrade
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Streaming voice turns / SSE: don't buffer, allow long-lived connections.
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ONNX Runtime (browser voice mode) loads its wasm glue via a dynamically
    # imported ES module. nginx's default mime.types serves .mjs as
    # application/octet-stream, which browsers refuse to execute as a module
    # ("Failed to fetch dynamically imported module"). Force a JS MIME type.
    location ~* \.mjs$ {
        default_type text/javascript;
    }

    # SPA fallback: serve index.html for client-side routes.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
