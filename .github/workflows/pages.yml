name: Website

# Publishes site/ (video, click demo, install guide) to GitHub Pages:
# https://ai-traqc.github.io/transcibio/
# One-time setup in the AI-Traqc/transcibio repo: Settings -> Pages -> Source: "GitHub Actions".

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    # The same commits are pushed to a personal mirror without Pages; deploy only from the org.
    if: github.repository_owner == 'AI-Traqc'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4
