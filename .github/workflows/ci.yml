name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same branch/PR to save runner minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (ruff + pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      # The heavy ML stack (torch / torchaudio / pyannote.audio / faster-whisper /
      # kokoro / soundfile) is imported lazily and replaced by fakes in the tests,
      # so CI installs only the light runtime + dev tools. This keeps the run to
      # seconds instead of pulling multi-GB CUDA wheels. Naming the light packages
      # explicitly also sidesteps the cu128 torch pin in [tool.uv.sources]. If any
      # module starts importing one of those packages at top level, add it here.
      - name: Install dependencies
        run: |
          uv pip install --system \
            "fastapi>=0.115,<1" \
            "python-multipart>=0.0.20,<1" \
            "python-dotenv" \
            "httpx" \
            "pytest==8.3.5" \
            "ruff==0.11.5"

      - name: Ruff lint
        run: ruff check

      - name: Ruff format
        run: ruff format --check

      - name: Pytest
        run: pytest -q

  frontend:
    name: Frontend (tsc + vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # postinstall runs setup:vad, which copies offline VAD assets out of
      # node_modules (no network needed).
      - name: Install dependencies
        run: npm ci

      - name: TypeScript typecheck
        run: npx tsc -b

      - name: Vitest
        run: npx vitest run
